context:
  name: rhppandas
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: fddb3cb475073f284a768d771f38ad2d121484fc213b8bbf2b4929af421ae922

build:
  noarch: python
  script:
    - python -m pip install . --no-deps -vv
  number: 0

requirements:
  host:
    - python ==${{ python_min }}
    - poetry-core >=2.0,<3.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - rhealpixdggs >=0.7.1
    - geopandas
    - numpy
    - pandas
    - shapely
    - typing-extensions

tests:
  - python:
      imports:
        - rhppandas
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - pytest -v tests/
    requirements:
      run:
        - pytest
        - python ==${{ python_min }}
    files:
      source:
        - tests/

about:
  homepage: "https://github.com/manaakiwhenua/rHP-Pandas"
  repository: "https://github.com/manaakiwhenua/rHP-Pandas"
  summary: "Integration of rHEALPixDGGS and Pandas/GeoPandas"
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - alpha-beta-soup
  tags:
    - rhealpix
    - DGGS
    - Discrete Global Grid System
    - geospatial
    - spatial
    - reference system
